name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stub .env file
        run: cp .env.example .env

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

  validate-nginx:
    name: Validate Nginx Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Frontend Nginx Config
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v ${{ github.workspace }}/config/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine nginx -t

      - name: Test Admin Nginx Config
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v ${{ github.workspace }}/config/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine nginx -t

  deploy:
    name: Deploy Stack via SSH
    needs: [validate-compose, validate-nginx]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency: production
    steps:
      - name: Sync config, pull and restart stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/vstore' }}"
            cd "$DEPLOY_PATH"

            # Acquire deployment lock to prevent race conditions with other repositories
            exec 200>"$DEPLOY_PATH/.deploy.lock"
            echo "==> Acquiring deployment lock..."
            flock -w 300 200 || { echo "ERROR: Timeout waiting for deployment lock!"; exit 1; }

            # Record current git commit and container images for rollback
            PREV_GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
            PREV_BACKEND_IMAGE=$(docker inspect --format='{{.Image}}' $(docker compose ps -q backend 2>/dev/null) 2>/dev/null || true)
            PREV_FRONTEND_IMAGE=$(docker inspect --format='{{.Image}}' $(docker compose ps -q frontend 2>/dev/null) 2>/dev/null || true)
            PREV_ADMIN_IMAGE=$(docker inspect --format='{{.Image}}' $(docker compose ps -q admin 2>/dev/null) 2>/dev/null || true)
            echo "==> Pre-deploy state: commit=$PREV_GIT_COMMIT, backend=$PREV_BACKEND_IMAGE, frontend=$PREV_FRONTEND_IMAGE, admin=$PREV_ADMIN_IMAGE"

            echo "==> Synchronizing repository state from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Pulling container images..."
            docker compose pull

            echo "==> Restarting entire stack..."
            docker compose up -d --remove-orphans

            echo "==> Verifying stack services health..."
            RETRIES=20
            HEALTHY=false
            for i in $(seq 1 $RETRIES); do
              B_OK=0; F_OK=0; A_OK=0; PROXY_OK=0
              curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1 && B_OK=1
              curl -sf http://127.0.0.1:3000/healthz > /dev/null 2>&1 && F_OK=1
              curl -sf http://127.0.0.1:3001/healthz > /dev/null 2>&1 && A_OK=1
              curl -sf http://127.0.0.1:3000/api/v1/games/ > /dev/null 2>&1 && PROXY_OK=1

              if [ "$B_OK" -eq 1 ] && [ "$F_OK" -eq 1 ] && [ "$A_OK" -eq 1 ] && [ "$PROXY_OK" -eq 1 ]; then
                echo "All services and proxy routes (backend, frontend, admin) are healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting for all services and proxy routes to become healthy ($i/$RETRIES)..."
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Stack health check failed!"
              docker compose ps
              docker compose logs --tail=50

              echo "==> Initiating automated stack rollback..."
              if [ -n "$PREV_GIT_COMMIT" ]; then
                echo "==> Restoring previous repository configuration ($PREV_GIT_COMMIT)..."
                git reset --hard "$PREV_GIT_COMMIT"
              fi

              echo "==> Restoring previous container images..."
              BACKEND_IMAGE="${PREV_BACKEND_IMAGE:-}" \
              FRONTEND_IMAGE="${PREV_FRONTEND_IMAGE:-}" \
              ADMIN_IMAGE="${PREV_ADMIN_IMAGE:-}" \
              docker compose up -d --remove-orphans
              echo "==> Stack rollback complete. Previous configuration restored."
              exit 1
            fi

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "==> Infra stack deployment completed successfully."
