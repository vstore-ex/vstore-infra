name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create stub .env file
        run: cp .env.example .env

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Verify Redis policy and adoption guards
        run: python3 -m unittest discover -s tests -p 'test_redis_policy.py' -v

      - name: Verify Redis restart, crash, memory pressure and application loss semantics
        env:
          REDIS_POLICY_REPORT: redis-policy.json
        run: python3 tests/smoke_redis_policy.py

      - name: Retain Redis policy verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redis-policy-${{ github.sha }}
          path: redis-policy.json
          retention-days: 7
          if-no-files-found: warn

      - name: Verify proxy bootstrap without certificates
        run: bash tests/smoke-proxy.sh

      - name: Verify certificate issuance ordering and deployment locking
        run: python3 -m unittest discover -s tests -p 'test_tls_bootstrap.py' -v

      - name: Verify release state and deployment failure handling
        run: python3 -m unittest discover -s tests -p 'test_release_state.py' -v

      - name: Verify validated infrastructure revision and obsolete runs
        run: python3 -m unittest discover -s tests -p 'test_infra_revision.py' -v

      - name: Verify isolated deployment and rollback across fresh sessions
        run: python3 tests/smoke_release_state.py

      - name: Verify trusted client identity configuration
        run: python3 -m unittest discover -s tests -p 'test_client_identity.py' -v

      - name: Verify forwarding trust and rate limits with real Redis
        run: python3 tests/smoke_client_identity.py

      - name: Verify HTTPS API response and certificate policy
        run: python3 -m unittest discover -s tests -p 'test_proxy_health.py' -v

      - name: Verify upstream recreation and HTTPS API failure gates
        run: python3 tests/smoke_upstream_recovery.py

      - name: Verify private deployment permissions
        run: python3 -m unittest discover -s tests -p 'test_deployment_permissions.py' -v

      - name: Verify deployment isolation and app storage mounts
        run: python3 tests/smoke_deployment_permissions.py

      - name: Verify database recovery guards
        run: python3 -m unittest discover -s tests -p 'test_database_recovery.py' -v

      - name: Verify PostgreSQL 17 snapshot and recovery
        run: python3 tests/smoke_database_recovery.py

      - name: Execute Edge Gateway & TLS automation tests
        run: python3 -m unittest tests/test_gateway.py -v


  validate-monitoring:
    name: Validate opt-in monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify private ports and fail-closed preparation
        run: python3 -m unittest discover -s tests -p 'test_monitoring*.py' -v
      - name: Run official validators without network or host collector privileges
        run: python3 tests/validate_monitoring.py

  verify-offhost-recovery:
    name: Verify off-host replacement recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify weekly boot scheduling and recovery safety
        run: python3 -m unittest discover -s tests -p 'test_offhost_backup.py' -v

      - name: Install isolated checksum-pinned backup tooling
        run: |
          python3 scripts/install-restic.py --directory "$RUNNER_TEMP/backup-bin"
          echo "$RUNNER_TEMP/backup-bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/pip" install -r scripts/requirements-backup.txt

      - name: Lose fixture host and verify replacement data and storage
        env:
          A06_DRILL_REPORT: ${{ runner.temp }}/a06-drill.json
        run: '"$RUNNER_TEMP/backup-venv/bin/python" tests/smoke_offhost_backup.py'

      - name: Preserve replacement recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a06-replacement-recovery
          path: ${{ runner.temp }}/a06-drill.json
          if-no-files-found: error
          retention-days: 14

  build-proxy:
    name: Build and scan edge proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify edge publication identity guards
        run: python3 -m unittest discover -s tests -p 'test_edge_publish.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Extract edge metadata
        id: meta
        uses: docker/metadata-action@70b2cdc6480c1a8b86edf1777157f8f437de2166 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}-proxy
          tags: type=sha,format=long,prefix=sha-

      - name: Build fresh edge runtime
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: config/nginx
          load: true
          platforms: linux/amd64
          provenance: false
          pull: true
          no-cache-filters: runtime
          tags: local-edge:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record built artifact identity
        id: built
        run: echo "image_id=$(docker image inspect local-edge:scan --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      - name: Verify scanned artifact bootstrap and Nginx syntax
        env:
          EDGE_IMAGE_ID: ${{ steps.built.outputs.image_id }}
        run: bash tests/smoke-proxy.sh "$EDGE_IMAGE_ID"

      - name: Gate fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.built.outputs.image_id }}
          scanners: vuln
          format: json
          output: proxy-trivy.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Retain edge vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proxy-trivy-${{ github.sha }}
          path: proxy-trivy.json
          retention-days: 30
          if-no-files-found: warn

      - name: Verify immutable artifact through a disposable registry
        env:
          EDGE_IMAGE_ID: ${{ steps.built.outputs.image_id }}
        run: python3 tests/smoke_edge_artifact.py "$EDGE_IMAGE_ID"

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact scanned artifact
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          EDGE_IMAGE_ID: ${{ steps.built.outputs.image_id }}
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}-proxy
        run: |
          set -euo pipefail
          test "$(docker image inspect local-edge:scan --format '{{.Id}}')" = "$EDGE_IMAGE_ID"
          docker tag "$EDGE_IMAGE_ID" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          ref=$(docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' | python3 -c 'import json,sys; refs=[r for r in json.load(sys.stdin) if r.startswith(sys.argv[1]+"@sha256:")]; assert len(refs)==1; print(refs[0])' "$IMAGE_REPOSITORY")
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$IMAGE_REPOSITORY@$digest"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$EDGE_IMAGE_ID"
          echo "image=$image" >> "$GITHUB_OUTPUT"


  deploy:
    name: Apply Stack Config via SSH
    needs: [validate-compose, build-proxy, verify-offhost-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency: production
    steps:
      - name: Check SSH deployment readiness
        id: check-ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::SSH_HOST or SSH_KEY is not configured in secrets. Deployment cannot proceed."
            exit 1
          fi

          if ! nc -z -w 5 "${SSH_HOST}" "${SSH_PORT}" 2>/dev/null; then
            echo "::error::Production server (${SSH_HOST}:${SSH_PORT}) is offline. Deployment FAILED."
            exit 1
          fi

      - name: Sync config and apply stack via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EDGE_IMAGE: ${{ needs.build-proxy.outputs.image }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          envs: EDGE_IMAGE,DEPLOY_SHA
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            umask 077
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-$HOME/vstore}"
            cd "$DEPLOY_PATH"

            # Refuse unsafe lock paths without inspecting another deploy's files.
            python3 scripts/secure-deployment.py --lock-only
            exec 200>"$DEPLOY_PATH/.deploy.lock"
            echo "==> Acquiring deployment lock..."
            flock -w 300 200 || { echo "ERROR: Timeout waiting for deployment lock!"; exit 1; }

            if [ -f backups/.offhost-resume.json ]; then
              echo "ERROR: Interrupted backup requires scripts/offhost-backup.py resume before deployment."
              exit 1
            fi

            PREV_GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
            echo "==> Pre-deploy commit: ${PREV_GIT_COMMIT:-none}"

            # Reject obsolete runs under the deployment lock before changing config.
            # A newer main requires its own successful validation and edge scan.
            if ! [[ "${DEPLOY_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ERROR: DEPLOY_SHA must be the full validated commit SHA."
              exit 1
            fi
            git fetch origin refs/heads/main:refs/remotes/origin/main
            if [ "$DEPLOY_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]; then
              echo "ERROR: Obsolete infrastructure run; dispatch the current main commit."
              exit 1
            fi
            echo "==> Applying validated infrastructure commit: $DEPLOY_SHA"
            # Tracked Nginx mounts must stay readable without DAC_OVERRIDE.
            (umask 022; git reset --hard "$DEPLOY_SHA")
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "==> Checked-out infrastructure commit: $(git rev-parse HEAD)"

            # Adopt healthy running digests once, then ignore stale .env image pins.
            python3 scripts/secure-deployment.py
            source scripts/release-state.sh
            release_load
            # Keep the new gate available even when the previous config commit
            # predates this helper. The rollback still reads the restored Compose.
            if ! [[ "$EDGE_IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*@sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: Infra deploy requires the scanned edge registry digest."
              exit 1
            fi
            PREV_PROXY_IMAGE=$(release_state env | sed -n 's/^PROXY_IMAGE=//p')
            if [ -z "$PREV_PROXY_IMAGE" ]; then
              # First A05 rollout only: preserve the exact pre-existing local
              # artifact for failure recovery, without rebuilding it.
              container=$(docker compose ps -q proxy)
              [ -n "$container" ] || { echo "ERROR: No existing edge rollback artifact."; exit 1; }
              test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
              PREV_PROXY_IMAGE=$(docker inspect --format '{{.Image}}' "$container")
            fi
            PROXY_HEALTH_HELPER=$(mktemp)
            PROXY_OVERRIDE=$(mktemp)
            REDIS_OVERRIDE=$(mktemp)
            cp scripts/proxy-health.py "$PROXY_HEALTH_HELPER"
            trap 'rm -f "$PROXY_HEALTH_HELPER" "$PROXY_OVERRIDE" "$REDIS_OVERRIDE"' EXIT
            # Fail before recreation unless the live dataset has been converted.
            # Retain the adopted Redis command even when rolling Git config back:
            # old defaults would ignore AOF and load stale authentication state.
            python3 scripts/redis-policy.py --lock-fd 200 prepare > "$REDIS_OVERRIDE"
            proxy_override() {
              python3 - "$PROXY_OVERRIDE" "$1" <<'PYCODE'
            import json, sys
            with open(sys.argv[1], 'w') as stream:
                json.dump({'services': {'proxy': {'image': sys.argv[2], 'pull_policy': 'never'}}}, stream)
            PYCODE
            }
            edge_compose() {
              docker compose -f docker-compose.yml -f "$REDIS_OVERRIDE" -f "$PROXY_OVERRIDE" "$@"
            }
            proxy_override "$EDGE_IMAGE"
            # Pull the published digest explicitly. Compose never builds or
            # substitutes a tag, including when restoring legacy config.
            if ! (docker pull "$EDGE_IMAGE" && edge_compose up -d --no-build --remove-orphans --wait --wait-timeout 150 && edge_compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 150 proxy && python3 "$PROXY_HEALTH_HELPER" recover && release_state commit PROXY_IMAGE "$EDGE_IMAGE"); then
              docker compose ps -a || true
              docker compose logs --no-color --timestamps --tail=150 || true
              echo "ERROR: Stack failed to converge. Restoring config and edge artifact."
              if [ -n "$PREV_GIT_COMMIT" ]; then
                (umask 022; git reset --hard "$PREV_GIT_COMMIT")
                proxy_override "$PREV_PROXY_IMAGE"
                if edge_compose up -d --no-build --remove-orphans --wait --wait-timeout 150 && edge_compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 150 proxy && python3 "$PROXY_HEALTH_HELPER" recover; then
                  echo "==> Config and edge artifact rollback completed successfully."
                  if python3 -c 'import json,sys; sys.exit(0 if "redis" in json.load(open(sys.argv[1]))["services"] else 1)' "$REDIS_OVERRIDE"; then
                    echo "==> Redis retains AOF startup flags for this rollback. Restore reviewed Redis config/helpers before further operations on a pre-A07 checkout."
                  fi
                else
                  echo "ERROR: Config/edge rollback failed."
                  docker compose ps -a || true
                  docker compose logs --no-color --timestamps --tail=150 || true
                fi
              fi
              exit 1
            fi

            echo "==> Infra stack config applied successfully at $DEPLOY_SHA."
