name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create stub .env file
        run: cp .env.example .env

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Execute Edge Gateway & TLS automation tests
        run: python3 -m unittest tests/test_gateway.py -v


  deploy:
    name: Apply Stack Config via SSH
    needs: [validate-compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency: production
    steps:
      - name: Check SSH deployment readiness
        id: check-ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::SSH_HOST or SSH_KEY is not configured in secrets. Deployment cannot proceed."
            exit 1
          fi

          if ! nc -z -w 5 "${SSH_HOST}" "${SSH_PORT}" 2>/dev/null; then
            echo "::error::Production server (${SSH_HOST}:${SSH_PORT}) is offline. Deployment FAILED."
            exit 1
          fi

      - name: Sync config and apply stack via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-$HOME/vstore}"
            cd "$DEPLOY_PATH"

            exec 200>"$DEPLOY_PATH/.deploy.lock"
            echo "==> Acquiring deployment lock..."
            flock -w 300 200 || { echo "ERROR: Timeout waiting for deployment lock!"; exit 1; }

            PREV_GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
            echo "==> Pre-deploy commit: ${PREV_GIT_COMMIT:-none}"

            echo "==> Synchronizing repository state from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # App images are pinned by their own repo CI (digest refs via shell
            # env, which overrides the .env defaults). This deploy applies
            # compose config changes only.
            if ! docker compose up -d --remove-orphans --wait; then
              echo "ERROR: Stack failed to converge. Rolling back config to $PREV_GIT_COMMIT."
              if [ -n "$PREV_GIT_COMMIT" ]; then
                git reset --hard "$PREV_GIT_COMMIT"
                docker compose up -d --remove-orphans --wait
              fi
              exit 1
            fi

            echo "==> Infra stack config applied successfully."
