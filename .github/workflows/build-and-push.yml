name: Build & Push Docker Image

# Reusable build job for all VStore repos.
# Caller requirements:
#   - workflow-level `permissions: contents: read, packages: write`
#   - call with `secrets: inherit`
# `github.repository` in this file resolves to the CALLING repo,
# so the image is always pushed to the caller's own GHCR namespace.

on:
  workflow_call:
    inputs:
      no-cache-filters:
        description: "Docker build stages to rebuild without cache (for runtime package updates)"
        type: string
        default: ""
      push-on-pr:
        description: "Allow GHCR push even on pull_request events (plumbing validation only)"
        type: boolean
        default: false
    outputs:
      image:
        description: "Immutable image reference (name@sha256 digest)"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.digest && format('ghcr.io/{0}@{1}', github.repository, steps.push.outputs.digest) || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        if: inputs.push-on-pr || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@70b2cdc6480c1a8b86edf1777157f8f437de2166 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build Docker image locally for security scanning
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          no-cache-filters: ${{ inputs.no-cache-filters }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            local-image:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: "local-image:scan"
          format: "table"
          # Hard quality gate: build fails on actionable vulns.
          # ignore-unfixed excludes vulnerabilities without an available fix.
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker image to GHCR
        id: push
        if: inputs.push-on-pr || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Publish the exact image that passed Trivy, without rebuilding it.
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

          image_ref=$(docker image inspect local-image:scan --format '{{index .RepoDigests 0}}')
          digest="${image_ref##*@}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Published image has no valid registry digest."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
