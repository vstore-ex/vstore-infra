# Only the configured edge peer may supply the original request scheme.
# Direct requests and malformed/duplicate headers retain the local scheme.
geo $trusted_edge_proxy {
    default 0;
    ${EDGE_PROXY_IP} 1;
}

map "$trusted_edge_proxy:$http_x_forwarded_proto" $forwarded_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 150M;

    # Disable server version tokens in headers and error pages
    server_tokens off;

    # High-performance file transfer and keep-alive
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Dynamic Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xhtml+xml
        image/svg+xml
        image/x-icon
        font/woff2
        font/ttf;

    # Security headers applied at the server block level
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://placehold.co https://*.blob.core.windows.net https://lh3.googleusercontent.com https://*.steamstatic.com https://*.akamaihd.net; media-src 'self' blob: https://*.blob.core.windows.net https://*.steamstatic.com https://*.akamaihd.net; connect-src 'self' https://*.steamstatic.com https://*.akamaihd.net; frame-ancestors 'self';" always;

    # Block public access to hidden and sensitive files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Container liveness/readiness probe endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Reverse proxy for admin users endpoints with path rewrite
    location /api/v1/admin/users {
        rewrite ^/api/v1/admin/users/?$ /api/v1/users/admin break;
        rewrite ^/api/v1/admin/users/(.+)$ /api/v1/users/admin/$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # General reverse proxy for all backend API endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Reverse proxy for backend static files (media uploads, thumbnails)
    location ^~ /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Long-term immutable caching for Vite build assets (content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Moderate caching for static files in root (favicon, icons, fonts)
    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?|ttf|txt)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Root HTML document (never cache to ensure immediate updates)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://placehold.co https://*.blob.core.windows.net https://lh3.googleusercontent.com https://*.steamstatic.com https://*.akamaihd.net; media-src 'self' blob: https://*.blob.core.windows.net https://*.steamstatic.com https://*.akamaihd.net; connect-src 'self' https://*.steamstatic.com https://*.akamaihd.net; frame-ancestors 'self';" always;
    }

    # SPA client-side routing fallback to index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://placehold.co https://*.blob.core.windows.net https://lh3.googleusercontent.com https://*.steamstatic.com https://*.akamaihd.net; media-src 'self' blob: https://*.blob.core.windows.net https://*.steamstatic.com https://*.akamaihd.net; connect-src 'self' https://*.steamstatic.com https://*.akamaihd.net; frame-ancestors 'self';" always;
        try_files $uri $uri/ /index.html;
    }
}
