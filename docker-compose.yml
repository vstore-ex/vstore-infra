x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?set in .env}
  SECRET_KEY: ${SECRET_KEY:?set in .env}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  FRONTEND_URL: ${FRONTEND_URL:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    <<: *default-hardening
    image: ${BACKEND_IMAGE:-ghcr.io/vstore-ex/vstore:latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    environment:
      <<: *backend-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      PORT: 8080
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./storage:/app/storage
      - uploads_temp:/tmp/uploads
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *default-hardening
    image: ${BACKEND_IMAGE:-ghcr.io/vstore-ex/vstore:latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: celery -A app.worker.celery_app worker -Q default,media --loglevel=info -E -B
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "false"
    # Worker runs celery (no HTTP server) but shares the backend image whose
    # HEALTHCHECK probes HTTP :8000 — without this compose --wait fails on it.
    healthcheck:
      disable: true
    volumes:
      - ./storage:/app/storage
      - uploads_temp:/tmp/uploads
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    <<: *default-hardening
    image: ${FRONTEND_IMAGE:-ghcr.io/vstore-ex/vstore-front:latest}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    # Host-side CI health checks; public traffic still enters through the TLS proxy.
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    <<: *default-hardening
    image: ${ADMIN_IMAGE:-ghcr.io/vstore-ex/vstore-admin:latest}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:8080"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  proxy:
    <<: *default-hardening
    # Re-add minimal caps removed by *default-hardening (cap_drop: ALL):
    # - NET_BIND_SERVICE: bind to privileged ports 80/443
    # - CHOWN: initialize nginx cache directory ownership
    # - SETUID/SETGID: nginx master drops to 'nginx' user for workers
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    image: vstore-proxy:local
    build:
      context: ./config/nginx
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-vstore.local}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.vstore.local}
      ADMIN_CERT_NAME: ${ADMIN_CERT_NAME:-${FRONTEND_DOMAIN:-vstore.local}}
      NGINX_ENVSUBST_FILTER: "FRONTEND_DOMAIN|ADMIN_DOMAIN|ADMIN_CERT_NAME"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - ./config/nginx/entrypoint/10-init-dummy-certs.sh:/docker-entrypoint.d/10-init-dummy-certs.sh:ro
      - ./config/nginx/entrypoint/20-periodic-reload.sh:/docker-entrypoint.d/30-periodic-reload.sh:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - app_net
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    <<: *default-hardening
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - app_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 1h & wait $${!}; done'"

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_temp:
  certbot_certs:
  certbot_webroot:
