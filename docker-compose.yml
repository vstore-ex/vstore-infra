x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging

    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: notverysmart/vstore-backend:latest
    restart: unless-stopped
    logging: *default-logging

    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PORT: 8080

    ports:
      - "127.0.0.1:8080:8000"

    networks:
      - app_net

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: notverysmart/vstore-frontend:latest
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      - backend

    ports:
      - "0.0.0.0:3000:8080"

    volumes:
      - ./config/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_net

  admin:
    image: notverysmart/vstore-admin:latest
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      - backend

    ports:
      - "0.0.0.0:3001:8080"

    volumes:
      - ./config/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
