x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?set in .env}
  SECRET_KEY: ${SECRET_KEY:?set in .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  # Always the bundled Redis with its password; stale .env CELERY_* values must not bypass auth.
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Simulated wallet top-up (no external payment service in this deployment).
  ENABLE_DEMO_WALLET_TOP_UP: ${ENABLE_DEMO_WALLET_TOP_UP:-true}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    labels:
      vstore.redis.policy: a07-v1
    # Convert the live dataset before recreating an existing RDB-only instance.
    # An empty AOF would otherwise take precedence over its old RDB snapshot.
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /data/dump.rdb ] && [ ! -s /data/appendonlydir/appendonly.aof.manifest ] && [ ! -s /data/appendonly.aof ]; then
          echo 'ERROR: RDB-only Redis requires reviewed live AOF adoption first.' >&2
          exit 1
        fi
        # The password goes in via stdin so it never appears in the process list.
        # Compose requires REDIS_PASSWORD; only bare fixtures run without one.
        auth=''
        [ -z "$${REDIS_PASSWORD:-}" ] || auth="requirepass $$REDIS_PASSWORD"
        exec /usr/local/bin/docker-entrypoint.sh redis-server - \
          --dir /data --appendonly yes --appendfsync everysec \
          --no-appendfsync-on-rewrite no --aof-load-truncated no \
          --save '' --maxmemory 64mb --maxmemory-policy noeviction \
          --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb <<EOF
        $$auth
        EOF
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      # redis-cli (healthcheck, ops scripts via docker exec) authenticates from this.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    <<: *default-hardening
    # Override the image's wildcard proxy trust without modifying backend code.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "${EDGE_PROXY_IP:-172.31.240.2},${FRONTEND_PROXY_IP:-172.31.240.3},${ADMIN_PROXY_IP:-172.31.240.4}"
    image: ${BACKEND_IMAGE:-ghcr.io/vstore-ex/vstore:latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    environment:
      <<: *backend-env
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Thanos Query joins app_net under this alias when monitoring runs; otherwise the page reports it as down.
      MONITORING_QUERY_URL: ${MONITORING_QUERY_URL:-http://monitoring-query:10902}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PORT: 8080
      # Client identity is resolved once by Uvicorn, not from the leftmost raw XFF.
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./storage:/app/storage
      - uploads_temp:/tmp/uploads
    networks:
      app_net: {}
      proxy_net:
        # Reserve backend outside the trusted proxy slots before Docker allocates it.
        ipv4_address: ${BACKEND_PROXY_IP:-172.31.240.5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *default-hardening
    image: ${BACKEND_IMAGE:-ghcr.io/vstore-ex/vstore:latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: celery -A app.worker.celery_app worker -Q default,media --loglevel=info -E -B
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    environment:
      <<: *backend-env
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AUTO_MIGRATE: "false"
    # Worker runs celery (no HTTP server) but shares the backend image whose
    # HEALTHCHECK probes HTTP :8000 — without this compose --wait fails on it.
    healthcheck:
      disable: true
    volumes:
      - ./storage:/app/storage
      - uploads_temp:/tmp/uploads
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    <<: *default-hardening
    image: ${FRONTEND_IMAGE:-ghcr.io/vstore-ex/vstore-front:latest}
    environment:
      EDGE_PROXY_IP: ${EDGE_PROXY_IP:-172.31.240.2}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    # Host-side CI health checks; public traffic still enters through the TLS proxy.
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      proxy_net:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.31.240.3}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    <<: *default-hardening
    image: ${ADMIN_IMAGE:-ghcr.io/vstore-ex/vstore-admin:latest}
    environment:
      EDGE_PROXY_IP: ${EDGE_PROXY_IP:-172.31.240.2}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:8080"
    networks:
      proxy_net:
        ipv4_address: ${ADMIN_PROXY_IP:-172.31.240.4}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  proxy:
    <<: *default-hardening
    # Re-add minimal caps removed by *default-hardening (cap_drop: ALL):
    # - NET_BIND_SERVICE: bind to privileged ports 80/443
    # - CHOWN: initialize nginx cache directory ownership
    # - SETUID/SETGID: nginx master drops to 'nginx' user for workers
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    # Production consumes the artifact built, smoked and scanned by Infra CI.
    image: ${PROXY_IMAGE:-ghcr.io/vstore-ex/vstore-infra-proxy:latest}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-vstore.local}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.vstore.local}
      ADMIN_CERT_NAME: ${ADMIN_CERT_NAME:-${FRONTEND_DOMAIN:-vstore.local}}
      NGINX_ENVSUBST_FILTER: "FRONTEND_DOMAIN|ADMIN_DOMAIN|ADMIN_CERT_NAME"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - ./config/nginx/entrypoint/10-init-dummy-certs.sh:/docker-entrypoint.d/10-init-dummy-certs.sh:ro
      - ./config/nginx/entrypoint/20-periodic-reload.sh:/docker-entrypoint.d/30-periodic-reload.sh:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      proxy_net:
        ipv4_address: ${EDGE_PROXY_IP:-172.31.240.2}
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    <<: *default-hardening
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Own network: renewals need the internet, never Postgres or Redis on app_net.
    networks:
      - certbot_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 1h & wait $${!}; done'"

networks:
  app_net:
    driver: bridge
  certbot_net:
    driver: bridge
  # Exact proxy addresses are trusted; other containers and the bridge gateway are not.
  proxy_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_NET_SUBNET:-172.31.240.0/28}

volumes:
  postgres_data:
  redis_data:
  uploads_temp:
  certbot_certs:
  certbot_webroot:
