global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: vstore-production
    replica: single
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Upload and retention health: Prometheus deletes local blocks after its
  # retention window whether or not the sidecar shipped them to Blob.
  - job_name: thanos-sidecar
    static_configs:
      - targets: ["sidecar:10902"]
  - job_name: thanos-compact
    static_configs:
      - targets: ["compact:10902"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: thanos-store
    static_configs:
      - targets: ["store:10902"]
  - job_name: thanos-query
    static_configs:
      - targets: ["query:10902"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
