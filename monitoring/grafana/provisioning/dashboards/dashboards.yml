apiVersion: 1
providers:
  # VStore/ holds dashboards built for this project; Community/ holds pinned
  # grafana.com dashboards vendored by scripts/grafana-dashboards.py.
  - name: VStore
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
