apiVersion: 1
datasources:
  - name: VStore Metrics
    uid: vstore-metrics
    type: prometheus
    access: proxy
    url: http://query:10902
    isDefault: true
    editable: false
    jsonData: {timeInterval: 30s, httpMethod: POST}
  - name: VStore Logs
    uid: vstore-logs
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: VStore Alerts
    uid: vstore-alerts
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData: {implementation: prometheus, handleGrafanaManagedAlerts: false}
