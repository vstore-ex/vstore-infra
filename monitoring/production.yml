# Explicit Linux/systemd opt-in. Run monitoring-guard.sh check before each up.
x-guard: &guard
  cgroup_parent: vstore-monitoring.slice
  oom_score_adj: 500
  restart: "no"
services:
  init: {<<: *guard}
  prometheus: {<<: *guard}
  sidecar: {<<: *guard}
  store: {<<: *guard}
  query:
    <<: *guard
    # The backend reads chart data for the admin Monitoring page from this read-only query API.
    networks:
      monitoring: {}
      app: {aliases: [monitoring-query]}
  compact: {<<: *guard}
  loki: {<<: *guard}
  alloy: {<<: *guard}
  grafana: {<<: *guard}
  alertmanager: {<<: *guard}
networks:
  app:
    external: true
    name: ${VSTORE_COMPOSE_PROJECT:-vstore}_app_net
